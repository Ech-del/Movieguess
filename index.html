<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Guess 🎬</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="game">


        <!-- ===============================
             TITRE
             =============================== -->

        <h1>🎬 MOVIE GUESS</h1>


        <!-- ===============================
             CATÉGORIE
             =============================== -->

        <h2 id="category-title">
            Catégorie
        </h2>


        <!-- ===============================
             COMPTEUR
             =============================== -->

        <p id="counter">
            Référence 1 / 8
        </p>


        <!-- ===============================
             CARTE DE JEU
             =============================== -->

        <div class="reference">


            <div class="reference-number">
                RÉFÉRENCE
            </div>


            <h2 id="reference-title">
                Référence 1
            </h2>


            <p id="points">
                1 POINT
            </p>


            <!-- ===============================
                 LECTEUR AUDIO
                 =============================== -->

            <div class="audio-zone">

                <div class="audio-label">
                    🎧 EXTRAIT AUDIO
                </div>


                <button
                    id="play-button"
                    onclick="toggleAudio()"
                >
                    ▶️ LANCER L'EXTRAIT
                </button>


                <audio
                    id="audio-player"
                    preload="metadata"
                >
                </audio>

            </div>


            <!-- ===============================
                 RÉPONSE
                 =============================== -->

            <button
                id="answer-button"
                onclick="showAnswer()"
            >
                👁️ AFFICHER LA RÉPONSE
            </button>


            <p
                id="answer"
                style="display: none;"
            ></p>


        </div>


        <!-- ===============================
             RÉFÉRENCE SUIVANTE
             =============================== -->

        <button
            class="next-button"
            onclick="nextReference()"
        >
            RÉFÉRENCE SUIVANTE →
        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
